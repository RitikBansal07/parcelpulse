name: Test & Deploy ParcelPulse to GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to execute'
        required: true
        default: 'test_and_deploy'
        type: choice
        options:
          - 'test_and_deploy'
          - 'test_only'
      release_note:
        description: 'Optional manual release notes / trigger reason'
        required: false
        default: 'Manual workflow dispatch'
        type: string

permissions:
  contents: write

jobs:
  test:
    name: Run Unit, Domain & Component Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Execute Jest Test Suite
        run: npm test -- --ci --maxWorkers=2

  deploy:
    name: Build & Deploy Static Web Bundle
    needs: test
    if: |
      (github.event_name != 'workflow_dispatch' || inputs.action != 'test_only') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Static Web Bundle
        run: npx expo export -p web

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false
